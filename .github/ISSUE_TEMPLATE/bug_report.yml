name: 问题反馈 / Bug report
description: 使用虚构数据提交可复现的问题
labels: []
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞请按 SECURITY.md 使用私密报告渠道。不要上传真实剪贴板内容、地址、私钥、助记词、凭据或个人路径。
  - type: input
    id: version
    attributes:
      label: 软件版本 / 提交
      placeholder: 例如 0.1.0-alpha 或 commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: Windows 版本、主程序/目标程序位数、开发或正式构建、保护模式。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 使用虚构内容；说明相关规则和设置。
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的补充信息
      description: 可选。截取最小必要日志或应用窗口；说明失败是否可重复、是否重试。
  - type: checkboxes
    id: privacy
    attributes:
      label: 数据检查
      options:
        - label: 我已移除真实剪贴板内容、凭据和个人信息。
          required: true
