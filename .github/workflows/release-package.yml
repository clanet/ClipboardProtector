name: Release package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify tag matches VERSION
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -cne "v$version") {
            throw "Tag must match VERSION (v$version)."
          }
      - name: Build and package release binaries
        run: ./tools/package-release.ps1
      - name: Upload package for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClipboardProtector-release-package
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
